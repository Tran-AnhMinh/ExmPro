<section class="add-area">
    <div class="input-box">
        <input type="text" placeholder="Thêm công việc" class="ip-task-name" [class.input-error]="errorMessage" required [(ngModel)]="name" (input)="clearError()" (keyup.enter)="addTask()"/>
        @if (errorMessage) {
            <span class="error-msg">{{ errorMessage }}</span>
        }
    </div>
    <button class="btn-save-task" (click)="addTask()">Thêm</button>
</section>  
<section class="sumupArea">
    <p>
        Con <span class="complete-num">{{ taskState.incompleteCount() }}</span>
        / <span class="total-num">{{ taskState.totalCount() }}</span>
        việc chưa làm
    </p>
</section>
