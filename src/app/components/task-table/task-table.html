<mat-radio-group >
  <mat-radio-button (click)="onShowAll()" value="all" checked>Tất cả</mat-radio-button>
  <mat-radio-button (click)="onShowIncomplete()" value="incomplete">Chưa hoàn thành</mat-radio-button>
  <mat-radio-button (click)="onShowComplete()" value="complete">Hoàn thành</mat-radio-button>
</mat-radio-group>

<table class="task-table">
  <thead>
    <tr>
      <th class="task-table-header" style="width: 50px;">Hoàn thành</th>
      <th class="task-table-header" >
        <p>Công việc</p>
        <button (click)="onSortByName()">
          <img src="images\sort.png" width="16" height="16" alt="Sort Icon" class="sort-icon">
        </button>
      </th>
      <th class="task-table-header">
        <p>Thời gian tạo</p>
        <button (click)="onSortByTime()">
          <img src="images\sort.png" width="16" height="16" alt="Sort Icon" class="sort-icon">
        </button>
      </th>
      <th class="task-table-header">Sửa</th>
      <th class="task-table-header">Xoá</th>
    </tr>
  </thead>
  <tbody>
    @for (task of dataSource; track task.id) {
    <tr app-task-table-row [taskDescription]="task" (toggleComplete)="onToggleComplete($event)"
      (editTask)="onEditTask($event)" (deleteTask)="onDeleteTask($event)">
    </tr>
    }
  </tbody>
</table>
