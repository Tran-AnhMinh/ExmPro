<td class="task-table-row-box">
  <input type="checkbox" [checked]="taskDescription.completed" (change)="onToggle()">
</td>

<td class="task-table-row-box">
  @if (isEditing) {
  <div class="edit-box">
    <input type="text" [(ngModel)]="editingName" [class.input-error]="errorMessage" (input)="clearError()" (keyup.enter)="onSave()" (keyup.escape)="onCancel()"/>
    @if (errorMessage) {
      <span class="error-msg">{{ errorMessage }}</span>
    }
  </div>
  } @else {
    @if(taskDescription.completed){
      <span class="completed-class"><del>{{ taskDescription.name }}</del></span>
    }
    @else {
      <span>{{ taskDescription.name }}</span>
    }
  }
</td>

<td class="task-table-row-box">
  <p>{{taskDescription.timeCreated|date:'dd/MM/yyyy'}}</p>
</td>

<td class="task-table-row-box">
  @if(isEditing){
    <button (click)="onCancel()">Cancel</button>
    <button (click)="onSave()">Save</button>
  } @else {
    <button (click)="onEdit()">Edit</button>
  }
</td>

<td class="task-table-row-box">
  <button (click)="onDelete()">Delete</button>
</td>
